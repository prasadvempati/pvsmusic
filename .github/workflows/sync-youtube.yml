name: Sync songs from YouTube

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run workflow" button for an instant sync

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync songs.js
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/sync-youtube.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "pvs-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/songs.js
          git commit -m "Auto-sync songs from YouTube"
          git push
